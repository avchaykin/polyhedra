  'Kepler–Poinsot polyhedra': '#b04f8c',
  'Stellations of icosahedron': '#d66f3d',
  'Stellations of cuboctahedron': '#7b62c4',
  'Stellations of icosidodecahedron': '#4b78c9',
};

const H = 0.06;             // max subdivided edge length (sphere radius = 1)
const SPHERE_R = 1;

// ---------- geometry ----------

function mergeVertices(m) {
  const key = new Map(), V = [], remap = [];
  for (let i = 0; i < m.v.length / 3; i++) {
    const x = m.v[3 * i], y = m.v[3 * i + 1], z = m.v[3 * i + 2];
    const k = `${Math.round(x * 1e4)},${Math.round(y * 1e4)},${Math.round(z * 1e4)}`;
    if (!key.has(k)) { key.set(k, V.length); V.push(new THREE.Vector3(x, y, z)); }
    remap.push(key.get(k));
  }
  const F = m.f.map(f => f.map(i => remap[i]).filter((v, j, a) => v !== a[(j + 1) % a.length]));
  return { V, F: F.filter(f => f.length >= 3) };
}

function segmentsCross(a, b, c, d) {
  const o = (p, q, r) => Math.sign((q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x));
  return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
}

// Triangulate every face; returns flat triangles and an outward normal per face.
function triangulate(V, F) {
  const tris = [], faces = [];
  for (const f of F) {
    const pts = f.map(i => V[i]);
    const n = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y);
      c.add(a);
    }
    c.divideScalar(pts.length);
    if (n.lengthSq() < 1e-12) continue;
    n.normalize();
    if (n.dot(c) < 0) n.negate();
    faces.push({ f, n });

    const u = new THREE.Vector3().subVectors(pts[0], c).normalize();
    const w = new THREE.Vector3().crossVectors(n, u);
    const p2 = pts.map(p => { const d = p.clone().sub(c); return new THREE.Vector2(d.dot(u), d.dot(w)); });
    let simple = true;
    for (let i = 0; i < p2.length && simple; i++)
      for (let j = i + 2; j < p2.length; j++) {
        if (i === 0 && j === p2.length - 1) continue;
        if (segmentsCross(p2[i], p2[i + 1], p2[j], p2[(j + 1) % p2.length])) { simple = false; break; }
      }
    const push = (a, b, d) => {
      const e = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(d, a));
      tris.push(e.dot(n) >= 0 ? [a, b, d, n] : [a, d, b, n]);
    };
    if (simple) {
      for (const [i, j, k] of THREE.ShapeUtils.triangulateShape(p2, [])) push(pts[i], pts[j], pts[k]);
    } else {
      for (let i = 0; i < pts.length; i++) push(c, pts[i], pts[(i + 1) % pts.length]);
    }
  }
  return { tris, faces };
}

// Mean distance from the centre to the outer surface, sampled along Fibonacci directions.
function meanOuterRadius(tris) {
  const N = 240, T = new Float32Array(tris.length * 9);
  tris.forEach(([a, b, c], i) => T.set([a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z], i * 9));
  let sum = 0;
  for (let k = 0; k < N; k++) {
    const y = 1 - 2 * (k + 0.5) / N, r = Math.sqrt(1 - y * y), phi = k * 2.399963;
    const dx = r * Math.cos(phi), dy = y, dz = r * Math.sin(phi);
    let best = 0;
    for (let i = 0; i < T.length; i += 9) {
      const ax = T[i], ay = T[i + 1], az = T[i + 2];
      const e1x = T[i + 3] - ax, e1y = T[i + 4] - ay, e1z = T[i + 5] - az;
      const e2x = T[i + 6] - ax, e2y = T[i + 7] - ay, e2z = T[i + 8] - az;
      const px = dy * e2z - dz * e2y, py = dz * e2x - dx * e2z, pz = dx * e2y - dy * e2x;
      const det = e1x * px + e1y * py + e1z * pz;
      if (Math.abs(det) < 1e-12) continue;
      const inv = 1 / det, sx = -ax, sy = -ay, sz = -az;
      const uu = (sx * px + sy * py + sz * pz) * inv;
      if (uu < 0 || uu > 1) continue;
      const qx = sy * e1z - sz * e1y, qy = sz * e1x - sx * e1z, qz = sx * e1y - sy * e1x;
      const vv = (dx * qx + dy * qy + dz * qz) * inv;
      if (vv < 0 || uu + vv > 1) continue;
      const t = (e2x * qx + e2y * qy + e2z * qz) * inv;
      if (t > best) best = t;
    }
    sum += best;
  }
  return sum / N;
}

// Each shape carries its own surface plus a morph target that pushes every
// vertex radially onto the unit sphere: the sphere is the common shape that
// any two solids pass through.
function buildShape(w) {
  const m = byW.get(w);
  const { V, F } = mergeVertices(m);
  const { tris, faces } = triangulate(V, F);
  // mean radius sets the size; spiky stellations are capped so their points stay in frame
  const maxR = Math.max(...V.map(v => v.length()));
  const s = Math.min(1 / meanOuterRadius(tris), 1.7 / maxR);
  // triangles share these vectors (fan centroids included); scale each once
  new Set([...V, ...tris.flatMap(t => t.slice(0, 3))]).forEach(v => v.multiplyScalar(s));

  const pos = [], nrm = [], mpos = [], mnrm = [];
  const P = new THREE.Vector3(), D = new THREE.Vector3();
  const emit = (p, n) => {
    pos.push(p.x, p.y, p.z); nrm.push(n.x, n.y, n.z);
    D.copy(p).normalize();
    mpos.push(D.x * SPHERE_R, D.y * SPHERE_R, D.z * SPHERE_R); mnrm.push(D.x, D.y, D.z);
  };
  for (const [a, b, c, n] of tris) {
    const k = Math.min(64, Math.max(1, Math.ceil(Math.max(a.distanceTo(b), b.distanceTo(c), c.distanceTo(a)) / H)));
    const ab = new THREE.Vector3().subVectors(b, a).divideScalar(k);
    const ac = new THREE.Vector3().subVectors(c, a).divideScalar(k);
    const at = (i, j) => P.copy(a).addScaledVector(ab, i).addScaledVector(ac, j);
    for (let i = 0; i < k; i++)
      for (let j = 0; j < k - i; j++) {
        emit(at(i, j), n); emit(at(i + 1, j), n); emit(at(i, j + 1), n);
        if (i + j < k - 1) { emit(at(i + 1, j), n); emit(at(i + 1, j + 1), n); emit(at(i, j + 1), n); }
      }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  geo.morphAttributes.position = [new THREE.Float32BufferAttribute(mpos, 3)];
  geo.morphAttributes.normal = [new THREE.Float32BufferAttribute(mnrm, 3)];

  // Fold edges only: skip boundaries between coplanar pieces.
  const edgeFaces = new Map();
  for (const { f, n } of faces)
    f.forEach((i, j) => {
      const k2 = f[(j + 1) % f.length], key = i < k2 ? `${i}_${k2}` : `${k2}_${i}`;
      (edgeFaces.get(key) || edgeFaces.set(key, []).get(key)).push(n);
    });
  const lp = [], lm = [];
  for (const [key, ns] of edgeFaces) {
    if (ns.length === 2 && ns[0].dot(ns[1]) > 0.9999) continue;
    const [i, j] = key.split('_').map(Number), a = V[i], b = V[j];
    const k = Math.max(1, Math.ceil(a.distanceTo(b) / H));
    for (let t = 0; t < k; t++)
      for (const q of [t / k, (t + 1) / k]) {
        P.lerpVectors(a, b, q); lp.push(P.x, P.y, P.z);
        D.copy(P).normalize(); lm.push(D.x * SPHERE_R, D.y * SPHERE_R, D.z * SPHERE_R);
      }
  }
  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  lgeo.morphAttributes.position = [new THREE.Float32BufferAttribute(lm, 3)];

  return { w, m, geo, lgeo, color: new THREE.Color(FAMILY_COLOR[m.group] || '#9aa3b5') };
}

// ---------- scene ----------

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('msg').textContent = 'WebGL is not available in this browser.';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 5, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb4ff, 0.8);
rim.position.set(-4, -1, -3);
scene.add(rim);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.3, metalness: 0.12,
  clearcoat: 1, clearcoatRoughness: 0.12,
  iridescence: 0.35, iridescenceIOR: 1.6, iridescenceThicknessRange: [180, 520],
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});
const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0b0d12, transparent: true, opacity: 0.5 });

const pivot = new THREE.Group();
scene.add(pivot);
const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
const lines = new THREE.LineSegments(new THREE.BufferGeometry(), lineMaterial);
pivot.add(mesh, lines);

function show(shape) {
  mesh.geometry = shape.geo; lines.geometry = shape.lgeo;
  mesh.updateMorphTargets(); lines.updateMorphTargets();
}
function setMorph(s) {
  mesh.morphTargetInfluences[0] = s;
  lines.morphTargetInfluences[0] = s;
  lineMaterial.opacity = 0.5 * Math.pow(1 - s, 3);
  lines.visible = s < 0.98;
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep a ~2.3-radius view in the shorter dimension
  const half = 2.3 / Math.min(1, camera.aspect);
  camera.position.set(0, 0.35, half / Math.tan(THREE.MathUtils.degToRad(15)));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---------- choreography ----------

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W_SLOW = 0.35, W_FAST = reduceMotion ? 1.1 : 7.5;
const PHASES = [
  { id: 'cruise', dur: 0.8 },
  { id: 'accelerate', dur: 2.6 },
  { id: 'decelerate', dur: 3.0 },
  { id: 'morph', dur: 2.4 },
];
const SHAKE_AMP = reduceMotion ? 0 : 0.045, SHAKE_HZ = 3.4;
const easeInOut = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeSine = u => 0.5 - 0.5 * Math.cos(Math.PI * u);

const pool = MODELS.map(m => m.w);
const recent = [];
function pickNext(from) {
  const sym = byW.get(from).sym;
  const fresh = pool.filter(w => w !== from && !recent.includes(w));
  // mostly stay within the same symmetry so the morph keeps its axes
  const same = fresh.filter(w => byW.get(w).sym === sym);
  const list = same.length && Math.random() < 0.7 ? same : fresh;
  const w = list[Math.floor(Math.random() * list.length)];
  recent.push(w); if (recent.length > 12) recent.shift();
  return w;
}

const cache = new Map();
function shapeFor(w) {
  if (!cache.has(w)) cache.set(w, buildShape(w));
  return cache.get(w);
}
const idle = window.requestIdleCallback || (cb => setTimeout(cb, 1));

const hashW = Number((location.hash.match(/^#w(\d+)$/i) || [])[1]);
let current = shapeFor(byW.has(hashW) ? hashW : pool[Math.floor(Math.random() * pool.length)]);
let nextW = pickNext(current.w);
idle(() => shapeFor(nextW));
show(current);
setMorph(0);
material.color.copy(current.color);

let phase = 0, phaseT = 0, omega = W_SLOW, paused = false, swapped = false;
const axis = new THREE.Vector3(), dq = new THREE.Quaternion();
let clockT = 0;
const fromColor = new THREE.Color(), hud = {
  code: document.getElementById('code'), name: document.getElementById('name'), phase: document.getElementById('phase'),
};

function updateHud() {
  const P = PHASES[phase];
  hud.code.textContent = P.id === 'morph' ? `W${current.w} → W${nextW}` : `W${current.w}`;
  hud.name.textContent = current.m.name;
  hud.phase.textContent = `${paused ? 'paused' : P.id} · ω ${omega.toFixed(2)}`;
}

function enterPhase(i) {
  phase = i % PHASES.length; phaseT = 0; swapped = false;
  if (PHASES[phase].id === 'morph') { shapeFor(nextW); fromColor.copy(current.color); }
}

function step(dt) {
  phaseT += dt;
  const P = PHASES[phase], u = Math.min(1, phaseT / P.dur);
  if (P.id === 'cruise') omega = W_SLOW;
  else if (P.id === 'accelerate') omega = W_SLOW + (W_FAST - W_SLOW) * easeSine(u);
  else if (P.id === 'decelerate') omega = W_FAST - (W_FAST - W_SLOW) * easeSine(u);
  else {
    omega = W_SLOW;
    // inflate to the sphere, rest there briefly, swap, settle into the next solid
    const target = shapeFor(nextW);
    let s;
    if (u < 0.46) s = easeInOut(u / 0.46);
    else if (u < 0.54) s = 1;
    else s = easeInOut((1 - u) / 0.46);
    if (!swapped && u >= 0.5) { show(target); swapped = true; }
    setMorph(s);
    material.color.copy(fromColor).lerp(target.color, easeSine(u));
  }
  // quick breathing shake while the spin winds down, swelling in and out of the phase
  const shake = P.id === 'decelerate' ? SHAKE_AMP * Math.sin(Math.PI * u) * Math.sin(2 * Math.PI * SHAKE_HZ * phaseT) : 0;
  pivot.scale.setScalar(1 + shake);
  if (u >= 1) {
    if (P.id === 'morph') {
      // only the current and next solids stay in memory; the dense meshes are large
      cache.delete(current.w); current.geo.dispose(); current.lgeo.dispose();
      current = shapeFor(nextW);
      setMorph(0);
      history.replaceState(null, '', `#w${current.w}`);
      nextW = pickNext(current.w);
      idle(() => shapeFor(nextW));
    }
    enterPhase(phase + 1);
  }

  clockT += dt;
  axis.set(0.32 * Math.sin(clockT * 0.11), 1, 0.32 * Math.cos(clockT * 0.07)).normalize();
  dq.setFromAxisAngle(axis, omega * dt);
  pivot.quaternion.premultiply(dq);
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; updateHud(); }
  else if (e.key === 'ArrowRight' && PHASES[phase].id !== 'morph') enterPhase(PHASES.findIndex(p => p.id === 'morph'));
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) step(dt);
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__morphStarted = true;
document.getElementById('msg').hidden = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
